{% extends "base.html" %}
{% block content %}
<div class="auth-shell">
  <div class="glass-card auth-card">
    <h2 style="text-align:center;">Reset password</h2>
    <p style="text-align:center; margin-bottom:20px;">Enter your email and we'll send reset instructions.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.email }}
      <button class="btn btn-primary" style="width:100%; margin-top:14px;" type="submit">Send reset link</button>
    </form>
  </div>
</div>
{% endblock %}
